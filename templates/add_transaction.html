{% extends "base.html" %}

{% block title %}Add Transaction | PennyWise{% endblock %}

{% block content %}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <h2 class="fw-bold mb-2">Add Transaction</h2>
                    <p class="text-muted mb-4">
                        Record your income or expenses.
                    </p>

                    <form method="POST" action="{{ url_for('add_transaction') }}">

                        <div class="mb-3">
                            <label class="form-label">Transaction Title</label>
                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="e.g. Salary, Shopping, Transport"
                                value="{{ transaction.title if transaction else '' }}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Amount (KSh)</label>
                            <input
                                type="number"
                                name="amount"
                                class="form-control"
                                placeholder="Enter amount"
                                step="0.01"
                                min="0.01"
                                value="{{ transaction.amount if transaction else '' }}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Transaction Type</label>
                            <select name="transaction_type" class="form-select" required>

                                <option value="">Select transaction type</option>

                                <option value="income"
                                    {% if transaction and transaction.transaction_type == 'income' %}selected{% endif %}>
                                    Income
                                </option>

                                <option value="expense"
                                    {% if transaction and transaction.transaction_type == 'expense' %}selected{% endif %}>
                                    Expense
                                </option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-select" required>

                                <option value="">Select category</option>
                                <option value="Salary">Salary</option>
                                <option value="Business">Business</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Education">Education</option>
                                <option value="Rent">Rent</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Health">Health</option>
                                <option value="Savings">Savings</option>
                                <option value="Other">Other</option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea
                                name="description"
                                class="form-control"
                                rows="3"
                                placeholder="Add additional details">{{ transaction.description if transaction else '' }}</textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Transaction Date</label>
                            <input
                                type="date"
                                name="transaction_date"
                                class="form-control"
                                value="{{ transaction.transaction_date.strftime('%Y-%m-%d') if transaction and transaction.transaction_date else '' }}"
                                required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                Save Transaction
                            </button>

                            <a href="{{ url_for('transactions') }}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
